# ds8 FXT configuration (distribution template)
#
# Copied into a work directory automatically when you run:
#   ds8 --inst fxt /path/to/work
# and that directory has no ds8*.toml yet. Edit the copy per observation.

[instrument]
name = "fxt"

[heasoft]
# How ds8 reaches the fxtsoft/HEASOFT tools.
#   "module" (default): load tools through Environment Modules. The init path is
#                       machine-specific, so adjust it for your installation.
#   "headas":           use $HEADAS from `source .../headas-init.sh` instead.
mode = "module"
module = "heasoft/fxt1.30"
modules_init = "/opt/homebrew/opt/modules/init/profile.sh"

[inputs]
event = "fxt_{detector}_*_po_cl_*.fits"
mkf = "fxt_*_mkf_*.fits"
# Region files loaded on startup. If absent, ds8 drops a default circle at the
# image centre. Overridable per-run with --src-reg / --bkg-reg.
src_region = "src.reg"
bkg_region = "bkg.reg"

[reference_region]
# Optional, read-only FK5 overlay (purple dashed line by default). It is not used for
# extraction. Choose ONE form; numeric radius values are degrees.
# ra = 83.633083
# dec = 22.014500
# radius = "30arcsec"
# label = "catalog position"
# color = "#DA70D6"
# Or load every circle/annulus in one DS9 FK5 file (relative to this directory):
# file = "reference.reg"

[epsc_sources]
# Optional detector-specific EPSC pipeline catalogs. When enabled, declare the CSV
# for every detector being displayed. Sources are numbered in CSV row order and
# drawn only on their own detector panel, in green by default.
# a = "srca.csv"  # FXTA
# b = "srcb.csv"  # FXTB
# color = "#7CFC00"
# snr_threshold = 7.0  # sources below this value are drawn gray

[detectors]
default = "b"

[detectors.a]
stem = "1fxta"
event = "fxt_a_*_po_cl_*.fits"
label = "FXTA"

[detectors.b]
stem = "1fxtb"
event = "fxt_b_*_po_cl_*.fits"
label = "FXTB"

[extraction]
energy_filter = true
pha_min = 38
pha_max = 925

[response_files]
mode = "generate"

[outputs]
products = ["src_pha", "bkg_pha", "rmf", "expo", "arf"]

frame_png = "{stem}-frame-interactive.png"

src_pha = "{stem}-src.pha"
bkg_pha = "{stem}-bkg.pha"
rmf = "{stem}.rmf"
expo = "{stem}-expo.fits"
arf = "{stem}-src.arf"

src_pha_interval = "{stem}-{label}-src.pha"
bkg_pha_interval = "{stem}-{label}-bkg.pha"
rmf_interval = "{stem}-{label}.rmf"
expo_interval = "{stem}-{label}-expo.fits"
arf_interval = "{stem}-{label}-src.arf"

lc_workdir = "{stem}-lc"
spec_workdir = "{stem}-spec"

[xspec]
profile = "fxt"
datasets = ["a", "b"]
ignore = "**-0.5 10.0-**"
statistic = "cstat"

[xspec.files]
data = "{stem}-src.pha"
background = "{stem}-bkg.pha"
rmf = "{stem}.rmf"
arf = "{stem}-src.arf"
